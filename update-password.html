<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Viora Education</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #001F3F 0%, #003366 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        .reset-card {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            width: 400px;
            max-width: 90%;
            text-align: center;
        }
        
        .reset-card img { height: 50px; margin-bottom: 1.5rem; }
        .reset-card h2 { color: #001F3F; margin-bottom: 0.5rem; }
        .reset-card p { color: #666; margin-bottom: 1.5rem; font-size: 0.9rem; }
        
        .reset-card input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
        }
        
        .reset-card button {
            width: 100%;
            padding: 1rem;
            background: #001F3F;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .reset-card button:hover { background: #003366; }
        
        .success { color: #22c55e; font-weight: 600; }
        .error { color: #dc2626; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="reset-card">
        <img src="logo.png" alt="Viora">
        <h2>Reset Password</h2>
        <p id="message">Enter your new password below.</p>
        
        <input type="password" id="newPassword" placeholder="New Password">
        <input type="password" id="confirmPassword" placeholder="Confirm New Password">
        
        <button onclick="updatePassword()">Update Password</button>
        
        <p id="status"></p>
        <p style="margin-top:1rem;"><a href="index.html" style="color:#00B4D8;text-decoration:none;">Back to Home</a></p>
    </div>

    <script>
        var supabaseUrl = 'https://csnxecalasvqbbbfzcoo.supabase.co';
        var supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzbnhlY2FsYXN2cWJiYmZ6Y29vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3ODUwMjEsImV4cCI6MjA5MjM2MTAyMX0.irzfAJb0W1nr9I24k83RhYnfiiI-gPpqPrceBC9WJsA';
        var supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Get URL params
        var params = new URLSearchParams(window.location.search);
        var token = params.get('token');
        var type = params.get('type');
        
        console.log('URL params:', params.toString());
        console.log('Token:', token);
        console.log('Type:', type);

        if (type === 'recovery' || type === 'email_change') {
            document.getElementById('message').textContent = 'Enter your new password to reset your account.';
        } else {
            document.getElementById('message').textContent = 'Invalid reset link. Please request a new password reset.';
            document.querySelector('button').disabled = true;
        }

        function updatePassword() {
            var newPass = document.getElementById('newPassword').value;
            var confirmPass = document.getElementById('confirmPassword').value;
            var status = document.getElementById('status');

            if (!newPass || newPass.length < 6) {
                status.className = 'error';
                status.textContent = 'Password must be at least 6 characters!';
                return;
            }

            if (newPass !== confirmPass) {
                status.className = 'error';
                status.textContent = 'Passwords do not match!';
                return;
            }

            if (token) {
                supabase.auth.verifyOtp({ email: '', token: token, type: type }).then(function() {
                    supabase.auth.updateUser({ password: newPass }).then(function(res) {
                        if (res.error) {
                            status.className = 'error';
                            status.textContent = res.error.message;
                        } else {
                            status.className = 'success';
                            status.textContent = 'Password updated successfully!';
                            setTimeout(function() {
                                window.location.href = 'index.html';
                            }, 2000);
                        }
                    });
                }).catch(function(err) {
                    status.className = 'error';
                    status.textContent = 'Error updating password. Try again.';
                });
            } else {
                status.className = 'error';
                status.textContent = 'Invalid reset link!';
            }
        }
    </script>
</body>
</html>
